server:
  port: 9000

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/auth/**, /api/users/**
        - id: forum-service
          uri: lb://forum-service
          predicates:
            - Path=/api/posts/**, /api/comments/**, /api/categories/**
        - id: admin-service
          uri: lb://forum-service
          predicates:
            - Path=/api/admin/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
        - id: report-service
          uri: lb://forum-service
          predicates:
            - Path=/api/reports/**
        - id: upload-service
          uri: lb://forum-service
          predicates:
            - Path=/api/upload/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
