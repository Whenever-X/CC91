server:
  port: 8083
spring:
  application:
    name: notification-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/cc91_db?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  allowed-methods: ${CORS_METHODS:GET,POST,PUT,DELETE,OPTIONS}

internal:
  token: ${INTERNAL_TOKEN}
