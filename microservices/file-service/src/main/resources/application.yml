server:
  port: 8086

spring:
  application:
    name: file-service
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  allowed-methods: ${CORS_METHODS:GET,POST,PUT,DELETE,OPTIONS}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        permittedNumberOfCallsInHalfOpenState: 3
    instances:
      userService:
        baseConfig: default

internal:
  token: ${INTERNAL_TOKEN}
